name: Setup QA Touchstone CI
description: Download, verify, and add the QA Touchstone headless CI runner to PATH.
inputs:
  version:
    description: Release tag or semver to install, for example v0.22.1. Defaults to the action ref when pinned to vX.Y.Z, then the bundled package version.
    required: false
    default: ''
  repo:
    description: GitHub repository that hosts QA Touchstone release assets.
    required: false
    default: asdfghj1237890/qa-touchstone
  install-dir:
    description: Directory where qa-touchstone-ci should be installed.
    required: false
    default: ''
  github-token:
    description: Optional token for private forks or higher GitHub release download rate limits.
    required: false
    default: ''
outputs:
  path:
    description: Absolute path to the installed qa-touchstone-ci binary.
    value: ${{ steps.install-unix.outputs.path || steps.install-windows.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install QA Touchstone CI
      id: install-unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ACTION_REF: ${{ github.action_ref }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        QA_TOUCHSTONE_CI_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        install_dir="${INPUT_INSTALL_DIR:-${RUNNER_TEMP}/qa-touchstone-ci/bin}"
        version="$INPUT_VERSION"
        if [[ -z "$version" && "${INPUT_ACTION_REF:-}" == v* ]]; then
          version="$INPUT_ACTION_REF"
        fi
        export QA_TOUCHSTONE_CI_INSTALL_ONLY=1
        export QA_TOUCHSTONE_CI_INSTALL_DIR="$install_dir"
        export QA_TOUCHSTONE_CI_REPO="$INPUT_REPO"
        export QA_TOUCHSTONE_CI_VERSION="$version"
        node "$GITHUB_ACTION_PATH/../packages/qa-touchstone-ci/bin/qa-touchstone-ci.mjs"
        bin="$install_dir/qa-touchstone-ci"
        echo "$install_dir" >> "$GITHUB_PATH"
        echo "path=$bin" >> "$GITHUB_OUTPUT"
        "$bin" --version

    - name: Install QA Touchstone CI
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ACTION_REF: ${{ github.action_ref }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        QA_TOUCHSTONE_CI_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        $installDir = if ($env:INPUT_INSTALL_DIR) { $env:INPUT_INSTALL_DIR } else { Join-Path $env:RUNNER_TEMP 'qa-touchstone-ci\bin' }
        $version = $env:INPUT_VERSION
        if (-not $version -and $env:INPUT_ACTION_REF -like 'v*') {
          $version = $env:INPUT_ACTION_REF
        }
        $env:QA_TOUCHSTONE_CI_INSTALL_ONLY = '1'
        $env:QA_TOUCHSTONE_CI_INSTALL_DIR = $installDir
        $env:QA_TOUCHSTONE_CI_REPO = $env:INPUT_REPO
        $env:QA_TOUCHSTONE_CI_VERSION = $version
        node "$env:GITHUB_ACTION_PATH/../packages/qa-touchstone-ci/bin/qa-touchstone-ci.mjs"
        $bin = Join-Path $installDir 'qa-touchstone-ci.exe'
        $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "path=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        & $bin --version
