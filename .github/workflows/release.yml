name: release

# Build the Tauri desktop app for Windows + macOS and publish a GitHub Release
# whenever a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled k6 binary
        run: npm run setup:k6:release

      # tauri-action runs the config's beforeBuildCommand (npm run build), builds
      # the platform bundle (NSIS on Windows, DMG on macOS via the per-platform
      # tauri.<os>.conf.json), and publishes a GitHub Release with the installers.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QA Companion ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Desktop installers for **Windows** and **macOS**. These builds are **not code-signed**, so the OS warns on first launch — bypass steps below. English first, 中文 在後。

            ## English

            ### Windows (NSIS installer)
            If you see "Windows protected your PC":
            1. Click **More info**
            2. Click **Run anyway**

            ### macOS (DMG · Apple Silicon / arm64)
            Gatekeeper blocks unsigned, un-notarized apps. Pick one:
            - **Right-click open**: in Applications, right-click (Control-click) QA Companion → **Open** → confirm **Open**.
            - **System Settings** (macOS 13+, if right-click has no Open): System Settings → Privacy & Security → find the blocked-app notice → **Open Anyway**.
            - If it reports the app is "damaged" (quarantine), run in Terminal:
              `xattr -dr com.apple.quarantine "/Applications/QA Companion.app"`

            ⚠️ macOS is **Apple Silicon (arm64) only**; Intel Macs are not yet supported.

            ---

            ## 中文

            桌面版安裝檔（Windows / macOS）。**這些 build 未經程式碼簽章**，第一次開啟需手動略過系統防護提示：

            ### Windows（NSIS 安裝檔）
            出現「Windows 已保護您的電腦」時：
            1. 點 **「其他資訊」**
            2. 點 **「仍要執行」**

            ### macOS（DMG · Apple Silicon / arm64）
            因未簽章、未公證，Gatekeeper 會擋。任選一種：
            - **右鍵開啟**：在「應用程式」對 QA Companion 按右鍵（Control+點一下）→「打開」→ 對話框再按一次「打開」。
            - **系統設定**（macOS 13+，若右鍵沒有「打開」）：系統設定 → 隱私權與安全性 → 找到被阻擋訊息 → 「仍要打開」。
            - 若提示「App 已損毀，無法打開」（quarantine），終端機執行：
              `xattr -dr com.apple.quarantine "/Applications/QA Companion.app"`

            ⚠️ macOS 僅提供 Apple Silicon（arm64）；Intel Mac 尚未提供。
