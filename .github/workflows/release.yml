name: release

# Build the Tauri desktop app for Windows + macOS and publish a GitHub Release
# whenever a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 測試門檻：前端 + Rust 測試全綠才允許 build 發佈。
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend tests (vitest)
        run: npm test

      # Tauri's build script validates the bundle resources declared in
      # tauri.windows.conf.json (resources/k6.exe), so materialize k6 before
      # cargo test or the build.rs fails with "resource path doesn't exist".
      - name: Fetch bundled k6 binary
        run: npm run setup:k6

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run headless functional test
        env:
          QA_TOUCHSTONE_CI_REAL_K6_BIN: src-tauri/resources/k6.exe
        run: node scripts/headless-functional.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch bundled k6 binary
        run: npm run setup:k6:release

      # tauri-action runs the config's beforeBuildCommand (npm run build), builds
      # the platform bundle (NSIS on Windows, DMG on macOS via the per-platform
      # tauri.<os>.conf.json), and publishes a GitHub Release with the installers.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QA Touchstone ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Desktop installers for **Windows** and **macOS**. These builds are **not code-signed**, so the OS warns on first launch — bypass steps below. English first, 中文 在後。

            ## English

            ### Windows
            Two options:
            - **Installer** (`-x64-setup.exe`): standard install. If you see "Windows protected your PC" → **More info** → **Run anyway**.
            - **Portable** (`-x64-portable.zip`): no install, no admin rights. Unzip and run `QA Touchstone.exe`. Keep the sibling `resources/` folder — it holds the bundled k6 used for performance testing.

            ### Headless CI
            Use the `asdfghj1237890/qa-touchstone/setup-ci@${{ github.ref_name }}` GitHub Action to install the headless runner in CI. If npm publishing is enabled for this release, `npx qa-touchstone-ci@<version> --help` works too (same version as this release, without the leading `v`). You can also download `qa-touchstone-ci-<os>-<arch>` plus its `.sha256` file manually. Supported CI commands are `ping`, `import`, `send`, `run`, `scan`, `bola-suggest`, and k6-backed `perf`. The headless CLI does not bundle k6; install k6 on the runner before using `qa-touchstone-ci perf`.

            ### macOS (DMG · Apple Silicon / arm64)
            Gatekeeper blocks unsigned, un-notarized apps. Pick one:
            - **Right-click open**: in Applications, right-click (Control-click) QA Touchstone → **Open** → confirm **Open**.
            - **System Settings** (macOS 13+, if right-click has no Open): System Settings → Privacy & Security → find the blocked-app notice → **Open Anyway**.
            - If it reports the app is "damaged" (quarantine), run in Terminal:
              `xattr -dr com.apple.quarantine "/Applications/QA Touchstone.app"`

            ⚠️ macOS is **Apple Silicon (arm64) only**; Intel Macs are not yet supported.

            ---

            ## 中文

            桌面版安裝檔（Windows / macOS）。**這些 build 未經程式碼簽章**，第一次開啟需手動略過系統防護提示：

            ### Windows
            兩種任選：
            - **安裝版**（`-x64-setup.exe`）：一般安裝。若出現「Windows 已保護您的電腦」→「其他資訊」→「仍要執行」。
            - **免安裝版**（`-x64-portable.zip`）：免安裝、免系統管理員權限。解壓後執行 `QA Touchstone.exe`，並保留旁邊的 `resources/` 資料夾（內含效能測試用的 k6）。

            ### Headless CI
            在 CI 可用 `asdfghj1237890/qa-touchstone/setup-ci@${{ github.ref_name }}` GitHub Action 安裝 headless runner。若這次 release 有啟用 npm publish，也可用 `npx qa-touchstone-ci@<version> --help`（與本 release 相同版本，但不含開頭的 `v`）。也可以手動下載 `qa-touchstone-ci-<os>-<arch>` 與對應 `.sha256` 檔。支援的 CI 指令為 `ping`、`import`、`send`、`run`、`scan`、`bola-suggest`，以及 k6-backed `perf`。Headless CLI 不會 bundle k6；使用 `qa-touchstone-ci perf` 前請先在 runner 安裝 k6。

            ### macOS（DMG · Apple Silicon / arm64）
            因未簽章、未公證，Gatekeeper 會擋。任選一種：
            - **右鍵開啟**：在「應用程式」對 QA Touchstone 按右鍵（Control+點一下）→「打開」→ 對話框再按一次「打開」。
            - **系統設定**（macOS 13+，若右鍵沒有「打開」）：系統設定 → 隱私權與安全性 → 找到被阻擋訊息 → 「仍要打開」。
            - 若提示「App 已損毀，無法打開」（quarantine），終端機執行：
              `xattr -dr com.apple.quarantine "/Applications/QA Touchstone.app"`

            ⚠️ macOS 僅提供 Apple Silicon（arm64）；Intel Mac 尚未提供。

      # Tauri has no native "portable" Windows target, so assemble one by hand:
      # the raw exe + its bundled resources/ (k6), zipped. Same layout the NSIS
      # installer lays down, so BaseDirectory::Resource resolves k6 next to the exe.
      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $stage = "portable/QA Touchstone"
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
                 Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          if (-not $exe) { throw "No portable exe found under src-tauri/target/release" }
          Copy-Item $exe.FullName "$stage/QA Touchstone.exe"
          Copy-Item "src-tauri/resources/k6.exe" "$stage/resources/k6.exe"
          $zip = "QA.Touchstone_${ver}_x64-portable.zip"
          Compress-Archive -Path "$stage" -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" "$zip" --clobber

  headless-cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            osName: linux
          - platform: macos-latest
            osName: macos
          - platform: windows-latest
            osName: windows
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Build headless CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml -p qa-touchstone-ci --release

      - name: Package headless CLI (Unix)
        if: matrix.osName != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          name="qa-touchstone-ci-${{ matrix.osName }}-${arch}"
          mkdir -p "dist/${name}"
          cp src-tauri/target/release/qa-touchstone-ci "dist/${name}/qa-touchstone-ci"
          chmod +x "dist/${name}/qa-touchstone-ci"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          echo "SHA_ASSET=${name}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package headless CLI (Windows)
        if: matrix.osName == 'windows'
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          $name = "qa-touchstone-ci-windows-$arch"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "src-tauri/target/release/qa-touchstone-ci.exe" "dist/$name/qa-touchstone-ci.exe"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHA_ASSET=$name.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Functional test packaged headless CLI (Unix)
        if: matrix.osName != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-functional
          mkdir -p dist-functional
          tar -xzf "$ASSET" -C dist-functional
          bin="$(find dist-functional -type f -name qa-touchstone-ci | head -n 1)"
          if [[ -z "$bin" ]]; then
            echo "::error::packaged qa-touchstone-ci binary not found"
            exit 1
          fi
          QA_TOUCHSTONE_CI_UNDER_TEST="$PWD/$bin" \
          QA_TOUCHSTONE_CI_SKIP_BUILD=1 \
          QA_TOUCHSTONE_CI_EXPECT_VERSION="${GITHUB_REF_NAME#v}" \
            node scripts/headless-functional.mjs

      - name: Functional test packaged headless CLI (Windows)
        if: matrix.osName == 'windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist-functional -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist-functional | Out-Null
          Expand-Archive -LiteralPath $env:ASSET -DestinationPath dist-functional -Force
          $bin = Get-ChildItem dist-functional -Recurse -Filter qa-touchstone-ci.exe | Select-Object -First 1
          if (-not $bin) { throw "packaged qa-touchstone-ci.exe binary not found" }
          $env:QA_TOUCHSTONE_CI_UNDER_TEST = $bin.FullName
          $env:QA_TOUCHSTONE_CI_SKIP_BUILD = '1'
          $env:QA_TOUCHSTONE_CI_EXPECT_VERSION = "${{ github.ref_name }}" -replace '^v',''
          node scripts/headless-functional.mjs

      - name: Upload headless CLI release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "$ASSET" "$SHA_ASSET" --clobber

  headless-install-smoke:
    needs: headless-cli
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Install QA Touchstone CI from release asset
        id: setup
        uses: ./setup-ci
        with:
          version: ${{ github.ref_name }}

      - name: Smoke setup-ci output path
        env:
          QTC_BIN: ${{ steps.setup.outputs.path }}
          QTC_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const { spawnSync } = require("node:child_process");
            const expected = process.env.QTC_EXPECT_VERSION.replace(/^v/, "");
            const r = spawnSync(process.env.QTC_BIN, ["--version"], { encoding: "utf8" });
            if (r.status !== 0) {
              process.stderr.write(r.stderr || r.stdout || "qa-touchstone-ci --version failed");
              process.exit(r.status || 1);
            }
            const m = r.stdout.trim().match(/^qa-touchstone-ci\s+(\S+)$/);
            if (!m || m[1] !== expected) {
              process.stderr.write(`version mismatch: expected ${expected}, got ${r.stdout}`);
              process.exit(1);
            }
          '

      - name: Functional test setup-ci PATH CLI
        env:
          QA_TOUCHSTONE_CI_PATH_UNDER_TEST: '1'
          QA_TOUCHSTONE_CI_SKIP_BUILD: '1'
          QA_TOUCHSTONE_CI_EXPECT_VERSION: ${{ github.ref_name }}
        run: node scripts/headless-functional.mjs

  publish-npm:
    needs: headless-install-smoke
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish npm launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "qa-touchstone-ci@${version}" version >/dev/null 2>&1; then
            echo "qa-touchstone-ci@${version} is already published; skipping."
            exit 0
          fi
          cd packages/qa-touchstone-ci
          npm version "$version" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance

  npx-install-smoke:
    needs: publish-npm
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Functional test npx launcher
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          QA_TOUCHSTONE_CI_NPX_UNDER_TEST="$version" \
          QA_TOUCHSTONE_CI_EXPECT_VERSION="$version" \
            node scripts/headless-functional.mjs
