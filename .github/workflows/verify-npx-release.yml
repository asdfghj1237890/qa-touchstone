name: verify-npx-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  npx-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26.12.1

      - name: Resolve release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/resolve-release-version.mjs

      - name: Wait for the published npm version to become visible
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for attempt in {1..12}; do
            actual=$(npm view "qa-touchstone-ci@$version" version --prefer-online --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)
            if [[ "$actual" == "$version" ]]; then exit 0; fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::qa-touchstone-ci@$version is not visible in the registry"
              exit 1
            fi
            echo "Waiting for registry visibility ($attempt/12)"
            sleep 10
          done

      - name: Functional test npx launcher
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          QA_TOUCHSTONE_CI_NPX_UNDER_TEST="$version" \
          QA_TOUCHSTONE_CI_EXPECT_VERSION="$version" \
            node scripts/headless-functional.mjs
