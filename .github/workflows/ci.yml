name: ci

# Test gate: every push / PR runs the full frontend suite, Rust unit tests,
# and dependency audits. The release workflow reuses the same gate so no
# release can ship without green tests.
#
# 供應鏈防禦：
#   - 所有 third-party actions 一律 pin 到 commit SHA（防 tag 被移動指向惡意
#     版本）；旁邊的註解標示對應的版本 tag，Dependabot（github-actions
#     ecosystem）會自動提 PR 更新。
#   - npm ci 帶 --ignore-scripts：CI 上不執行任何套件的 install script
#     （esbuild / @tauri-apps/cli / resvg 都改用 optionalDependencies 平台
#     套件散布二進位，不需要 postinstall；本機開發同樣以 allow-scripts 攔截）。
#   - cargo audit 對 Rust 依賴樹做 RustSec 已知漏洞檢查。
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate golden fixtures (staleness gate)
        run: |
          node scripts/gen-fixtures.mjs
          if ! git diff --quiet -- src-tauri/core/tests/fixtures; then
            echo "::error::golden fixtures are stale — run 'node scripts/gen-fixtures.mjs' and commit"
            git --no-pager diff -- src-tauri/core/tests/fixtures
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run frontend tests (vitest)
        run: npm test

      # Coverage gate: fails if coverage drops below the ratchet floor set in
      # vite.config.mjs (test.coverage.thresholds). Runs the suite a second time
      # with v8 instrumentation; keep the plain run above as the clean signal.
      - name: Coverage gate
        run: npm run test:coverage:ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      # uitests/ 的 playwright 樹沒有任何 job 會安裝（CI 不跑 GUI 測試），但
      # npm audit 只讀 lockfile、不需要 node_modules，所以能在這裡免費補上第
      # 四份 lockfile 的守門 —— 讓四份 lockfile 全部都有 audit 覆蓋。
      - name: Audit UI test dependencies
        working-directory: uitests
        run: npm audit --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # libdbus-1-dev + pkg-config: the keyring crate's Linux Secret Service
          # backend (dbus-secret-service) links libdbus for OS-keychain storage.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Run headless functional test
        run: node scripts/headless-functional.mjs

      - name: Assert CLI does not link tauri or keyring
        run: |
          tree=$(cargo tree --manifest-path src-tauri/Cargo.toml -p qa-touchstone-ci -e normal)
          echo "$tree"
          # Strip the " (/path/.../src-tauri/cli)" path parenthetical before matching so the
          # "src-tauri" in the checkout path cannot trigger a false positive; then match
          # tauri / keyring as whole package-name tokens (this also catches tauri-*/keyring-*).
          if echo "$tree" | sed 's/ (.*)//' | grep -Eq '\b(tauri|keyring)\b'; then
            echo "::error::qa-touchstone-ci must not depend on tauri/keyring"
            exit 1
          fi

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies (RustSec)
        working-directory: src-tauri
        run: cargo audit

  # Desktop E2E smoke：build 真正的 release binary，用 tauri-driver +
  # WebdriverIO 在 Xvfb 下驅動整個 app shell。唯一路徑：launch → import demo
  # collection → send → security suite → export 報告並斷言檔案落地（守
  # v0.21.1「打包版匯出全滅」的 bug class）。詳見 e2e/README.md。
  # Linux 不需要 k6：無 tauri.linux.conf.json → 無 bundle resources 宣告
  # （Windows 本機跑法見 e2e/README.md —— 那邊需要先 setup-k6）。
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # webkit2gtk 在 Xvfb / software GL 下的已知渲染 workaround。
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies (+ WebDriver + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config webkit2gtk-driver xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      # e2e/ 有自己的 lockfile，不在 frontend job 那支 npm audit 的範圍內 ——
      # 少了這步，WDIO 依賴樹的漏洞永遠不會被 CI 擋下來（brace-expansion 與
      # fast-xml-parser 就是這樣長期只出現在 Dependabot alerts、CI 卻全綠）。
      # 擺在 build 之前：audit 只要幾秒，不必等 release build 跑完才失敗。
      - name: Audit E2E dependencies
        working-directory: e2e
        run: npm audit --audit-level=high

      # rust-cache 會快取 ~/.cargo/bin，第二次起這步是 no-op。
      - name: Install tauri-driver
        run: command -v tauri-driver >/dev/null || cargo install tauri-driver --locked

      # npx 直接呼叫 tauri CLI binary，不經 npm script —— 所以 pretauri:build
      # （k6 下載）不會跑；冒煙路徑不碰 perf。--no-bundle：只要 raw binary，
      # 不打 deb/appimage。beforeBuildCommand（npm run build / vite）照跑。
      - name: Build desktop app (release, no bundle)
        run: npx tauri build --no-bundle

      - name: Run E2E smoke (xvfb)
        working-directory: e2e
        run: xvfb-run --auto-servernum npm test

      - name: Upload failure diagnostics (screenshots)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e/logs/
          if-no-files-found: ignore
          retention-days: 7
