# Dependabot：三個生態系的依賴更新 PR（安全更新即時、版本更新每週彙整）。
# workflows 內的 actions 已 pin 到 commit SHA —— github-actions ecosystem
# 會自動提 PR 把 SHA 推進到新版本（並更新旁邊的版本註解）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      e2e-npm-minor-patch:
        update-types: ["minor", "patch"]

  # uitests/ 有自己的 lockfile，但 CI 沒有任何 job 會跑它（playwright 只在本機
  # 手動執行），所以在這裡補上更新來源 —— 否則它是四份 lockfile 裡唯一既沒有
  # Dependabot alert、也沒有 audit gate 的一份，會無聲腐化。
  - package-ecosystem: npm
    directory: /uitests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uitests-npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
