# cargo-audit configuration (read by the `cargo audit` CI job, which runs with
# working-directory: src-tauri — see .github/workflows/ci.yml).

# plist 1.10.4 uses patched quick-xml, so the former RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 exceptions are no longer needed.
#
# Two informational warnings remain visible in Tauri's Linux GTK 0.18 graph:
# - RUSTSEC-2024-0370: proc-macro-error, through glib-macros / gtk3-macros.
# - RUSTSEC-2024-0429: glib 0.18's unsound VariantStrIter implementation.
# The fixed GTK 0.19 / glib 0.22 stack requires coordinated upstream changes:
# https://github.com/tauri-apps/wry/pull/1843
# https://github.com/tauri-apps/tao/pull/1332
# Revisit when those changes ship in stable Tauri. Keep these warnings visible;
# do not add them to ignore or replace the stable backend with draft branches.

[advisories]
ignore = []
