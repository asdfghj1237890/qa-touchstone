[workspace]
members = ["core", "cli"]
resolver = "2"

[package]
name = "qa-touchstone"
version = "0.23.0"
description = "QA Touchstone"
edition = "2021"

[lib]
name = "qa_touchstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qa_touchstone_core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["gzip", "deflate", "brotli"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = []

[dev-dependencies]
wiremock = "0.6"
