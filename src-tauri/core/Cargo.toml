[package]
name = "qa_touchstone_core"
version = "0.22.7"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
percent-encoding = "2"
log = "0.4"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "macros", "time"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
chrono = "0.4"
regex = "1"
rand = "0.9"
reqwest = { version = "0.13", features = ["gzip", "deflate", "brotli"] }

[dev-dependencies]
wiremock = "0.6"
roxmltree = "0.21"
