[package]
name = "qa-touchstone-ci"
version = "0.22.7"
edition = "2021"

[[bin]]
name = "qa-touchstone-ci"
path = "src/main.rs"

[dependencies]
qa_touchstone_core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["gzip", "deflate", "brotli"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
roxmltree = "0.20"
