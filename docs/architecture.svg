<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">QA Touchstone Architecture</title>
  <desc id="desc">Animated architecture diagram showing the Tauri desktop shell, React UI, request executor, security engines, storage, AI privacy gate, k6, and target APIs.</desc>
  <style>
    :root {
      color-scheme: dark;
    }
    svg {
      background: #07111f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .grid {
      stroke: #23405f;
      stroke-width: 1;
      opacity: 0.22;
    }
    .panel {
      fill: #09182a;
      stroke: #274966;
      stroke-width: 1;
    }
    .group-label {
      fill: #9fb6d8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .node rect {
      fill: #0d1d31;
      stroke: #5fb1ff;
      stroke-width: 1.5;
      filter: url(#softShadow);
    }
    .node.alt rect {
      stroke: #41d6a4;
    }
    .node.warn rect {
      stroke: #f2bf5e;
    }
    .node.ai rect {
      stroke: #d58cff;
    }
    .node text {
      fill: #edf6ff;
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
    }
    .node .sub {
      fill: #98aac2;
      font-size: 12px;
      font-weight: 500;
    }
    .flow {
      fill: none;
      stroke: #6cbcff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 12;
      marker-end: url(#arrowBlue);
      opacity: 0.82;
      animation: dash 1.8s linear infinite;
    }
    .flow.green {
      stroke: #48dfaa;
      marker-end: url(#arrowGreen);
      animation-duration: 2.2s;
    }
    .flow.gold {
      stroke: #f2bf5e;
      marker-end: url(#arrowGold);
      animation-duration: 2.6s;
    }
    .flow.purple {
      stroke: #d58cff;
      marker-end: url(#arrowPurple);
      animation-duration: 2.35s;
    }
    .pulse {
      animation: pulse 2.8s ease-in-out infinite;
    }
    .pulse.delay-1 {
      animation-delay: 0.45s;
    }
    .pulse.delay-2 {
      animation-delay: 0.9s;
    }
    .pulse.delay-3 {
      animation-delay: 1.35s;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -20;
      }
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.82;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow,
      .pulse {
        animation: none;
      }
    }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path class="grid" d="M 36 0 H 0 V 36"/>
    </pattern>
    <filter id="softShadow" x="-18%" y="-24%" width="136%" height="148%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c2340"/>
      <stop offset="0.48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10221d"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6cbcff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#48dfaa"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2bf5e"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d58cff"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGlow)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <circle cx="218" cy="158" r="132" fill="#1e84ff" opacity="0.08"/>
  <circle cx="1184" cy="570" r="210" fill="#48dfaa" opacity="0.08"/>
  <circle cx="980" cy="730" r="142" fill="#d58cff" opacity="0.08"/>

  <text x="72" y="64" fill="#f1f8ff" font-size="32" font-weight="800">QA Touchstone Architecture</text>
  <text x="72" y="94" fill="#9fb6d8" font-size="15">Local-first API QA workspace: UI workflows, safe execution, security evidence, AI egress controls, and CI artifacts.</text>

  <rect class="panel" x="60" y="135" width="260" height="150" rx="18"/>
  <rect class="panel" x="370" y="125" width="285" height="675" rx="18"/>
  <rect class="panel" x="735" y="125" width="310" height="235" rx="18"/>
  <rect class="panel" x="1115" y="125" width="265" height="250" rx="18"/>
  <rect class="panel" x="735" y="430" width="645" height="360" rx="18"/>

  <g id="flow-layer">
    <path class="flow" d="M 275 235 H 342 V 225 H 395"/>
    <path class="flow" d="M 498 270 V 302"/>
    <path class="flow" d="M 498 360 V 402"/>
    <path class="flow" d="M 498 460 V 502"/>
    <path class="flow" d="M 498 560 V 602"/>
    <path class="flow green" d="M 595 331 H 680 V 265 H 770"/>
    <path class="flow green" d="M 595 431 H 690 V 526 H 765"/>
    <path class="flow gold" d="M 595 531 H 695 V 296 H 770"/>
    <path class="flow purple" d="M 595 631 H 700 V 755 H 915"/>
    <path class="flow green" d="M 970 265 H 1080 V 238 H 1130"/>
    <path class="flow gold" d="M 970 296 H 1080 V 327 H 1130"/>
    <path class="flow" d="M 870 562 V 600"/>
    <path class="flow purple" d="M 970 526 H 1085"/>
    <path class="flow" d="M 970 636 H 1085"/>
    <path class="flow purple" d="M 1190 562 V 600"/>
    <path class="flow gold" d="M 870 672 V 755 H 915"/>
    <path class="flow gold" d="M 1190 672 V 755 H 1150"/>
  </g>

  <text class="group-label" x="86" y="168">Desktop</text>
  <text class="group-label" x="397" y="158">Frontend</text>
  <text class="group-label" x="762" y="158">Rust backend</text>
  <text class="group-label" x="1142" y="158">Targets</text>
  <text class="group-label" x="762" y="463">Evidence, AI, and persistence</text>

  <g class="node pulse" transform="translate(95 203)">
    <rect width="180" height="64" rx="13"/>
    <text x="90" y="28">QA engineer</text>
    <text class="sub" x="90" y="48">local operator</text>
  </g>

  <g class="node pulse delay-1" transform="translate(395 180)">
    <rect width="205" height="90" rx="13"/>
    <text x="102.5" y="34">React + Vite UI</text>
    <text class="sub" x="102.5" y="56">typed workspace state</text>
    <text class="sub" x="102.5" y="74">themes + bilingual UX</text>
  </g>
  <g class="node" transform="translate(395 302)">
    <rect width="205" height="58" rx="12"/>
    <text x="102.5" y="34">API Client + Runner</text>
  </g>
  <g class="node" transform="translate(395 402)">
    <rect width="205" height="58" rx="12"/>
    <text x="102.5" y="34">Security Suite</text>
  </g>
  <g class="node" transform="translate(395 502)">
    <rect width="205" height="58" rx="12"/>
    <text x="102.5" y="34">Performance + k6</text>
  </g>
  <g class="node" transform="translate(395 602)">
    <rect width="205" height="58" rx="12"/>
    <text x="102.5" y="34">Docs + Codegen</text>
  </g>

  <g class="node alt pulse delay-2" transform="translate(770 220)">
    <rect width="200" height="90" rx="13"/>
    <text x="100" y="34">Request Executor</text>
    <text class="sub" x="100" y="56">reqwest + redirects</text>
    <text class="sub" x="100" y="74">SigV4 + SSRF guard</text>
  </g>

  <g class="node alt pulse delay-3" transform="translate(1130 205)">
    <rect width="200" height="66" rx="13"/>
    <text x="100" y="30">Target APIs</text>
    <text class="sub" x="100" y="50">HTTP / WS / SSE</text>
  </g>
  <g class="node warn" transform="translate(1130 300)">
    <rect width="200" height="54" rx="12"/>
    <text x="100" y="33">OS keychain</text>
  </g>

  <g class="node" transform="translate(765 490)">
    <rect width="210" height="72" rx="13"/>
    <text x="105" y="31">Findings lifecycle</text>
    <text class="sub" x="105" y="52">baseline diff + status</text>
  </g>
  <g class="node" transform="translate(765 600)">
    <rect width="210" height="72" rx="13"/>
    <text x="105" y="31">Redacted evidence</text>
    <text class="sub" x="105" y="52">mask-by-default artifacts</text>
  </g>
  <g class="node ai pulse delay-1" transform="translate(1085 490)">
    <rect width="210" height="72" rx="13"/>
    <text x="105" y="31">AI privacy gate</text>
    <text class="sub" x="105" y="52">redact + preview + policy</text>
  </g>
  <g class="node ai" transform="translate(1085 600)">
    <rect width="210" height="72" rx="13"/>
    <text x="105" y="31">LLM providers</text>
    <text class="sub" x="105" y="52">OpenAI / self-managed</text>
  </g>
  <g class="node warn" transform="translate(915 720)">
    <rect width="235" height="70" rx="13"/>
    <text x="117.5" y="31">Versioned storage</text>
    <text class="sub" x="117.5" y="52">user_data.json + config.json</text>
  </g>

  <path d="M 70 835 H 1370" fill="none" stroke="#5fb1ff" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.5"/>
  <text x="72" y="854" fill="#9fb6d8" font-size="13">Animated dashed lines run behind the components, using open lanes so labels and nodes stay readable.</text>
</svg>
